# ============================================
# Grafana 完整可觀測性堆疊
# 組件：Loki + Prometheus + cAdvisor + DCGM + Alloy + Grafana + LogBERT
# ============================================

services:
  # ============================================
  # Loki - 日誌聚合系統
  # 用途：儲存和查詢日誌資料
  # ============================================
  loki:
    image: grafana/loki:3.6.0
    container_name: loki
    user: "0:0"               # Run as root to avoid permission issues
    ports:
      - "3100:3100"           # HTTP API
    volumes:
      - ./layer0-collector/loki/loki-config.yaml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki       # 持久化儲存
    command: -config.file=/etc/loki/local-config.yaml
    healthcheck:
      test: ["CMD", "/usr/bin/loki", "-version"]
      interval: 10s
      timeout: 5s
      retries: 10          # Increased retries
      start_period: 60s    # Added start period for initialization
    networks:
      - observability
    restart: unless-stopped

  # ============================================
  # Prometheus - 時序資料庫
  # 用途：儲存 metrics（CPU、記憶體等數值型資料）
  # ============================================
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"           # Web UI 和 API
    volumes:
      - ./prometheus/prometheus.yaml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'    # 保留 30 天
      - '--web.enable-lifecycle'                # 允許 reload 設定
      - '--web.enable-remote-write-receiver'    # 啟用 remote write endpoint
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - observability
    restart: unless-stopped

  # ============================================
  # cAdvisor - 容器資源監控
  # 用途：收集 Docker 容器的 CPU、記憶體、網路、磁碟 metrics
  # ============================================
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor
    ports:
      - "8081:8080"           # Web UI（主機端口改為 8081 避免衝突）
    volumes:
      # 唯讀掛載主機資源以收集 metrics
      - /:/rootfs:ro                          # 主機根目錄
      - /var/run:/var/run:ro                  # Docker socket 所在
      - /sys:/sys:ro                          # 系統資訊
      - /var/lib/docker/:/var/lib/docker:ro   # Docker 資料目錄
      - /dev/disk/:/dev/disk:ro               # 磁碟資訊
    command:
      # 性能優化參數
      - --housekeeping_interval=30s           # 降低採樣頻率（從 1s 增加到 30s）
      - --max_housekeeping_interval=35s       # 最大採樣間隔
      - --storage_duration=1m0s               # 減少歷史數據保留時間（從 2m 降到 1m）
      - --docker_only=true                    # 只監控 Docker 容器
      - --disable_metrics=percpu,sched,tcp,udp,diskIO,hugetlb,referenced_memory,cpu_topology,resctrl  # 禁用不需要的 metrics
    privileged: true          # 需要特權模式讀取系統資源
    devices:
      - /dev/kmsg             # Kernel 訊息
    networks:
      - observability
    restart: unless-stopped

  # ============================================
  # NVIDIA DCGM Exporter - GPU Metrics
  # 用途：收集 NVIDIA GPU 的使用率、記憶體、溫度等指標
  # ============================================
  dcgm-exporter:
    image: nvcr.io/nvidia/k8s/dcgm-exporter:3.3.8-3.6.0-ubuntu22.04
    container_name: dcgm-exporter
    profiles:
      - gpu
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
    ports:
      - "9400:9400"           # DCGM metrics endpoint
    cap_add:
      - SYS_ADMIN
    networks:
      - observability
    restart: unless-stopped

  # ============================================
  # Grafana Alloy - 遙測收集器
  # 用途：收集 Docker 日誌 + 系統日誌，轉發到 Loki
  # ============================================
  alloy:
    image: grafana/alloy:latest
    container_name: alloy
    ports:
      - "12345:12345"         # Web UI（除錯介面）
    volumes:
      - ./layer0-collector/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro    # Docker 日誌
      - /var/log/journal:/var/log/journal:ro            # systemd journal
      - /run/log/journal:/run/log/journal:ro            # journal (volatile)
      - /etc/machine-id:/etc/machine-id:ro              # machine ID
      - /var/log:/var/log:ro                            # System logs (for loki.source.file)
      - /proc:/host/proc:ro                             # Process info (for prometheus.exporter.process)
    command:
      - run
      - /etc/alloy/config.alloy
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
    depends_on:
      loki:
        condition: service_started    # Changed from service_healthy
    networks:
      - observability
    restart: unless-stopped

  # ============================================
  # Grafana - 可視化儀表板
  # 用途：查看日誌和 metrics 的 Web UI
  # ============================================
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"           # Web UI
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      loki:
        condition: service_started    # Changed from service_healthy
      prometheus:
        condition: service_started
    networks:
      - observability
    restart: unless-stopped

  # ============================================
  # Layer 1 Filter - 多層異常過濾
  # 用途：LogBERT 異常檢測 + PostgreSQL 持久化
  # ============================================
  layer1-filter:
    build: ./layer1-filter
    container_name: layer1-filter
    environment:
      # Loki configuration
      - LOKI_URL=http://loki:3100
      - LOKI_TENANT=raw
      - LOKI_QUERY=${LAYER1_LOKI_QUERY}
      - POLL_INTERVAL=10             # Poll every 10 seconds

      # Database configuration
      - DB_HOST=timescaledb
      - DB_PORT=5432
      - DB_NAME=logdb
      - DB_USER=logdb
      - DB_PASSWORD=${TIMESCALEDB_PASSWORD:-logdb_password}

      # LogBERT configuration
      - ANOMALY_THRESHOLD=${ANOMALY_THRESHOLD:-0.5}
      - BATCH_SIZE=${BATCH_SIZE:-50}
      - AADS_NODE_ID=${AADS_NODE_ID:-controller}
      - ENABLE_PATTERN_FILTER=${ENABLE_PATTERN_FILTER:-true}
      - ENABLE_LOGBERT_FILTER=${ENABLE_LOGBERT_FILTER:-true}
      - INITIAL_LOOKBACK_SECONDS=${INITIAL_LOOKBACK_SECONDS:-300}

    volumes:
      - ./logbert/models:/app/models  # Reuse LogBERT model files
    depends_on:
      loki:
        condition: service_started
      timescaledb:
        condition: service_healthy
    networks:
      - observability
    restart: unless-stopped

  # ============================================
  # Ingester - PostgreSQL Anomaly Ingester
  # 用途：接收 Alloy Fan-out 的異常資料並寫入 PostgreSQL
  # ============================================
  ingester:
    build: ./layer1-filter/ingester
    container_name: ingester
    ports:
      - "8000:8000"               # FastAPI endpoint
    environment:
      - DB_HOST=timescaledb
      - DB_PORT=5432
      - DB_NAME=logdb
      - DB_USER=logdb
      - DB_PASSWORD=${TIMESCALEDB_PASSWORD:-logdb_password}
    depends_on:
      timescaledb:
        condition: service_healthy
    networks:
      - observability
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).read()"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ============================================
  # TimescaleDB - Layer 0 持久化存儲
  # 用途：永久存儲 RAW log 和異常 log
  # ============================================
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: timescaledb
    ports:
      - "5432:5432"             # PostgreSQL 端口
    environment:
      - POSTGRES_USER=logdb
      - POSTGRES_PASSWORD=${TIMESCALEDB_PASSWORD:-logdb_password}
      - POSTGRES_DB=logdb
      - TIMESCALEDB_TELEMETRY=off
    volumes:
      - ./layer0-storage/timescaledb/migrations:/docker-entrypoint-initdb.d:ro
      - timescaledb-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U logdb"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - observability
    restart: unless-stopped

  # ============================================
  # Log Archiver - Loki → TimescaleDB 同步
  # 用途：將 RAW log 從 Loki 持久化到 TimescaleDB
  # ============================================
  log-archiver:
    build: ./layer0-storage/sync
    container_name: log-archiver
    environment:
      - LOKI_URL=http://loki:3100
      - DB_HOST=timescaledb
      - DB_PORT=5432
      - DB_NAME=logdb
      - DB_USER=logdb
      - DB_PASSWORD=${TIMESCALEDB_PASSWORD:-logdb_password}
      - AADS_NODE_ID=${AADS_NODE_ID:-controller}
      - POLL_INTERVAL=60          # 每 60 秒拉取一次
      - BATCH_SIZE=1000           # 每次拉取最多 1000 條
    depends_on:
      loki:
        condition: service_started
      timescaledb:
        condition: service_healthy
    networks:
      - observability
    restart: unless-stopped

  # ============================================
  # Layer 2 Analyzer - 根因分析
  # 用途：AI 驅動的根因分析和診斷
  # ============================================
  layer2-analyzer:
    build: ./layer2-analyzer
    container_name: layer2-analyzer
    ports:
      - "8080:8080"           # Layer 2 Webhook API
    environment:
      # Database
      - DB_HOST=timescaledb
      - DB_PORT=5432
      - DB_NAME=logdb
      - DB_USER=logdb
      - DB_PASSWORD=${TIMESCALEDB_PASSWORD:-logdb_password}
      # Consumer
      - POLL_INTERVAL=30
      - BATCH_SIZE=50
      # Aggregator
      - TIME_WINDOW_MINUTES=5
      - MIN_CLUSTER_SIZE=${MIN_CLUSTER_SIZE:-1}
      # Metrics
      - PROMETHEUS_URL=http://prometheus:9090
      # LLM
      - LLM_PROVIDER=${LLM_PROVIDER:-openai_compatible}
      - LLM_BASE_URL=http://litellm:4000/v1
      - LLM_API_KEY=${LITELLM_MASTER_KEY:-sk-aads-dev}
      - LLM_MODEL=${LITELLM_MODEL:-gpt-5.5}
      - LLM_STRATEGY=${LLM_STRATEGY:-cascade}
      - AADS_DEFAULT_NODE_ID=${AADS_DEFAULT_NODE_ID:-target-ubuntu}
      - AADS_NODE_ENVIRONMENT=${AADS_NODE_ENVIRONMENT:-test}
      - AADS_FORCE_GATE_APPROVAL=${AADS_FORCE_GATE_APPROVAL:-false}
      - ENABLE_DIAGNOSIS_REUSE=${ENABLE_DIAGNOSIS_REUSE:-false}
      # Ollama (optional)
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://ollama:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3.2:3b}
      - OLLAMA_ENABLED=${OLLAMA_ENABLED:-false}
      # Knowledge Base
      - ENABLE_KNOWLEDGE_BASE=${ENABLE_KNOWLEDGE_BASE:-false}
      - VECTOR_DB_PATH=/app/data/chromadb
      # Layer 3: Remediation & Notifications
      - AUTO_REMEDIATION_ENABLED=${AUTO_REMEDIATION_ENABLED:-false}
      - SEVERITY_FILTER=${SEVERITY_FILTER:-medium}
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL}
      - WEBHOOK_URL=${WEBHOOK_URL}
    volumes:
      - layer2-data:/app/data
    depends_on:
      timescaledb:
        condition: service_healthy
      prometheus:
        condition: service_started
      litellm:
        condition: service_started
    networks:
      - observability
    restart: unless-stopped

  # ============================================
  # LiteLLM - OpenAI-compatible LLM gateway
  # ============================================
  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    container_name: litellm
    ports:
      - "4000:4000"
    environment:
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY:-sk-aads-dev}
      - AADS_LITELLM_UPSTREAM_API_BASE=${AADS_LITELLM_UPSTREAM_API_BASE:-https://api.openai.com/v1}
      - AADS_LITELLM_UPSTREAM_API_KEY=${AADS_LITELLM_UPSTREAM_API_KEY:-}
      - LITELLM_LOG=INFO
    volumes:
      - ./litellm/config.yaml:/app/config.yaml:ro
    command: ["--config", "/app/config.yaml", "--host", "0.0.0.0", "--port", "4000"]
    networks:
      - observability
    restart: unless-stopped

  # ============================================
  # Knowledge Agent - deterministic FixingPlan execution
  # ============================================
  layer4-executor:
    build: ./layer4-executor
    container_name: layer4-executor
    environment:
      - DB_HOST=timescaledb
      - DB_PORT=5432
      - DB_NAME=logdb
      - DB_USER=logdb
      - DB_PASSWORD=${TIMESCALEDB_PASSWORD:-logdb_password}
      - PI_AGENT_TOKEN=${PI_AGENT_TOKEN}
      - EXECUTOR_POLL_INTERVAL=${EXECUTOR_POLL_INTERVAL:-5}
      - NODE_LOCK_TTL_SECONDS=${NODE_LOCK_TTL_SECONDS:-120}
      - ENABLE_KNOWLEDGE_BASE=${ENABLE_KNOWLEDGE_BASE:-false}
    depends_on:
      timescaledb:
        condition: service_healthy
    networks:
      - observability
    restart: unless-stopped

  # ============================================
  # Dashboard - 問題監控儀表板
  # 用途：Web UI 顯示診斷報告和異常統計
  # ============================================
  dashboard:
    build: ./dashboard
    container_name: dashboard
    ports:
      - "5000:5000"           # Web UI
    environment:
      - DB_HOST=timescaledb
      - DB_PORT=5432
      - DB_NAME=logdb
      - DB_USER=logdb
      - DB_PASSWORD=${TIMESCALEDB_PASSWORD:-logdb_password}
      - AADS_ADMIN_API_KEY=${AADS_ADMIN_API_KEY:-change-me-admin-key}
      - AADS_IDEMPOTENCY_TTL_MINUTES=${AADS_IDEMPOTENCY_TTL_MINUTES:-30}
    depends_on:
      timescaledb:
        condition: service_healthy
    networks:
      - observability
    restart: unless-stopped

# ============================================
# 持久化 Volumes
# ============================================
volumes:
  loki-data:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local
  timescaledb-data:
    driver: local
  layer2-data:
    driver: local

# ============================================
# 網路
# ============================================
networks:
  observability:
    driver: bridge

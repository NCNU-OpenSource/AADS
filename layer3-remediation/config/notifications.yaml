# Layer 3 Remediation Configuration

# Suggestion Generator
suggestions:
  auto_remediation_enabled: false  # Safety: only suggestions, no auto-execution

# Notification Settings
notifications:
  # Severity filter: only send notifications for this level and above
  # Options: low | medium | high | critical
  severity_filter: medium

  # Slack
  slack:
    enabled: ${SLACK_ENABLED:-true}
    webhook_url: ${SLACK_WEBHOOK_URL}

  # Custom Webhook
  webhook:
    enabled: ${WEBHOOK_ENABLED:-false}
    url: ${WEBHOOK_URL}

  # Email (future)
  email:
    enabled: false

# Logging
logging:
  level: INFO

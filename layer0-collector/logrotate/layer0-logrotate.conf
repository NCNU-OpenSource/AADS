# ============================================
# 注意事項：
# ============================================
# 1. 此配置檔需要放置於 /etc/logrotate.d/adds
# 2. 測試配置：sudo logrotate -d /etc/logrotate.d/adds
# 3. 強制執行：sudo logrotate -f /etc/logrotate.d/adds
# 4. Logrotate 預設由 cron 每日執行（/etc/cron.daily/logrotate）

# ============================================
# ADDS Layer 0 Log Rotation Configuration
# 目的：防止日誌撐爆硬碟，保留 7 天作為網路斷線時的緩衝
# ============================================

# ============================================
# 1. Audit 日誌輪轉（/var/log/audit/audit.log）
# ============================================
/var/log/audit/audit.log {
    # 每日輪轉一次
    daily

    # 保留 7 天
    rotate 7

    # 如果日誌不存在不報錯
    missingok

    # 不壓縮最新的日誌檔案（方便即時讀取）
    notifempty

    # 使用 gzip 壓縮舊日誌
    compress

    # 延遲壓縮（等到下次輪轉時再壓縮）
    delaycompress

    # 如果檔案已經被輪轉過則跳過
    sharedscripts

    # 輪轉後執行腳本
    postrotate
        # 告訴 auditd 重新打開日誌檔案
        /sbin/service auditd restart > /dev/null 2>&1 || true
    endscript

    # 建立新檔案的權限設定
    create 0600 root root
}

# ============================================
# 2. 系統日誌輪轉（/var/log/syslog）
# ============================================
/var/log/syslog {
    daily
    rotate 7
    missingok
    notifempty
    compress
    delaycompress
    sharedscripts
    postrotate
        /usr/lib/rsyslog/rsyslog-rotate
    endscript
    create 0640 syslog adm
}


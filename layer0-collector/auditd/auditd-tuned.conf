# ============================================
# ADDS Auditd Tuned Configuration
# 目的：容量限制與日誌數量限制，防止撐爆硬碟
# 參考：auditd.conf(5) - https://man7.org/linux/man-pages/man5/auditd.conf.5.html
# ============================================

# ============================================
# 日誌檔案設定
# ============================================

# 日誌檔案路徑
log_file = /var/log/audit/audit.log

# 日誌檔案格式（RAW = 原始格式）
log_format = RAW

# 日誌群組權限
log_group = root

# ============================================
# 日誌輪轉設定（容量限制）
# ============================================

# 單一日誌檔案最大大小（MB）
# 設定為 100MB，防止單一檔案過大
max_log_file = 100

# 達到 max_log_file 後的動作
# ROTATE = 輪轉（建立新檔案）
# SUSPEND = 暫停 audit
# KEEP_LOGS = 保留但停止寫入
max_log_file_action = ROTATE

# 保留的日誌檔案數量
# 設定為 10 個，配合 logrotate 的 7 天保留
# 100MB * 10 = 1GB 最大空間使用
num_logs = 10

# ============================================
# 磁碟空間管理（防止撐爆硬碟）
# ============================================

# 磁碟空間不足時的動作
# SUSPEND = 暫停 audit
# SYSLOG = 寫入 syslog
# IGNORE = 忽略
space_left_action = SYSLOG

# 磁碟空間剩餘多少時觸發 space_left_action（MB）
# 設定為 500MB
space_left = 500

# 管理員警告動作
admin_space_left_action = SUSPEND

# 管理員警告閾值（MB）
# 設定為 100MB
admin_space_left = 100

# 磁碟滿了的動作
# SUSPEND = 暫停 audit（防止系統掛掉）
disk_full_action = SUSPEND

# 磁碟錯誤動作
disk_error_action = SUSPEND

# ============================================
# Flush 設定
# ============================================

# 寫入磁碟的頻率
# INCREMENTAL = 漸進式（推薦）
# INCREMENTAL_ASYNC = 非同步漸進式
# DATA = 只 flush 資料
# SYNC = 同步（最安全但最慢）
# NONE = 不 flush（最快但可能遺失資料）
flush = INCREMENTAL_ASYNC

# 多少筆 event 後 flush 一次
freq = 50

# ============================================
# Priority Boost（優先權提升）
# ============================================

# auditd 的 nice 優先權
# 設定為 4（稍微提高優先權，但不影響系統）
priority_boost = 4

# ============================================
# Name Resolution（名稱解析）
# ============================================

# 是否將 UID/GID 轉換為名稱
# NONE = 不轉換（效能最好）
# USER = 轉換 UID
# GROUP = 轉換 GID
# BOTH = 全部轉換
name_format = NONE

# ============================================
# Dispatcher 設定（用於即時轉發）
# ============================================

# 是否啟用 dispatcher（audisp）
# yes = 啟用，可用於即時轉發給 SIEM
disp_qos = lossy

# Dispatcher 程式路徑
dispatcher = /sbin/audispd

# ============================================
# 其他設定
# ============================================

# TCP 包裝器設定
tcp_listen_port =
tcp_listen_queue = 5
tcp_max_per_addr = 1
tcp_client_ports = 1024-65535
tcp_client_max_idle = 0

# krb5 principal
krb5_principal = auditd

# 使用 libwrap
##enable_krb5 = no
##krb5_key_file = /etc/audit/audit.key

# ============================================
# 註解說明：
# ============================================
# 1. 此配置檔需要覆蓋 /etc/audit/auditd.conf
# 2. 修改後需重啟 auditd：sudo service auditd restart
# 3. 檢查狀態：sudo service auditd status
# 4. 檢查配置：sudo auditctl -l
# 5. 測試磁碟空間：df -h /var/log/audit

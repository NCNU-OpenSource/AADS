# ============================================================================
# AADS Server — production stack (prebuilt registry images).
#
# Same topology as docker-compose.yaml, but the 6 custom services are PULLED
# from a container registry instead of built locally. Use with the bootstrap:
#   docker compose -f docker-compose.prod.yaml --env-file .env up -d
#
# Image coordinates come from .env (defaults shown):
#   AADS_IMAGE_REGISTRY=ghcr.io/bs10081
#   AADS_IMAGE_TAG=latest
# Build/push the images with .github/workflows/build-images.yml (tag push v*).
# ============================================================================

services:
  # ── Observability infra (public images, identical to dev) ─────────────────
  loki:
    image: grafana/loki:3.6.0
    container_name: loki
    user: "0:0"
    ports:
      - "3100:3100"
    volumes:
      - ./layer0-collector/loki/loki-config.yaml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    healthcheck:
      test: ["CMD", "/usr/bin/loki", "-version"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - observability
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yaml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
      - '--web.enable-remote-write-receiver'
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - observability
    restart: unless-stopped

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor
    ports:
      - "8081:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    command:
      - --housekeeping_interval=30s
      - --max_housekeeping_interval=35s
      - --storage_duration=1m0s
      - --docker_only=true
      - --disable_metrics=percpu,sched,tcp,udp,diskIO,hugetlb,referenced_memory,cpu_topology,resctrl
    privileged: true
    devices:
      - /dev/kmsg
    networks:
      - observability
    restart: unless-stopped

  dcgm-exporter:
    image: nvcr.io/nvidia/k8s/dcgm-exporter:3.3.8-3.6.0-ubuntu22.04
    container_name: dcgm-exporter
    profiles:
      - gpu
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
    ports:
      - "9400:9400"
    cap_add:
      - SYS_ADMIN
    networks:
      - observability
    restart: unless-stopped

  alloy:
    image: grafana/alloy:latest
    container_name: alloy
    ports:
      - "12345:12345"
    volumes:
      - ./layer0-collector/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/log/journal:/var/log/journal:ro
      - /run/log/journal:/run/log/journal:ro
      - /etc/machine-id:/etc/machine-id:ro
      - /var/log:/var/log:ro
      - /proc:/host/proc:ro
    command:
      - run
      - /etc/alloy/config.alloy
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
    depends_on:
      loki:
        condition: service_started
    networks:
      - observability
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD:-admin}
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      loki:
        condition: service_started
      prometheus:
        condition: service_started
    networks:
      - observability
    restart: unless-stopped

  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: timescaledb
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=logdb
      - POSTGRES_PASSWORD=${TIMESCALEDB_PASSWORD:-logdb_password}
      - POSTGRES_DB=logdb
      - TIMESCALEDB_TELEMETRY=off
    volumes:
      - ./layer0-storage/timescaledb/migrations:/docker-entrypoint-initdb.d:ro
      - timescaledb-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U logdb"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - observability
    restart: unless-stopped

  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    container_name: litellm
    ports:
      - "4000:4000"
    environment:
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY:-sk-aads-dev}
      - AADS_LITELLM_UPSTREAM_API_BASE=${AADS_LITELLM_UPSTREAM_API_BASE:-https://api.openai.com/v1}
      - AADS_LITELLM_UPSTREAM_API_KEY=${AADS_LITELLM_UPSTREAM_API_KEY:-}
      - LITELLM_LOG=INFO
    volumes:
      - ./litellm/config.yaml:/app/config.yaml:ro
    command: ["--config", "/app/config.yaml", "--host", "0.0.0.0", "--port", "4000"]
    networks:
      - observability
    restart: unless-stopped

  # ── Custom AADS services (PULLED from registry) ───────────────────────────
  layer1-filter:
    image: ${AADS_IMAGE_REGISTRY:-ghcr.io/bs10081}/aads-layer1-filter:${AADS_IMAGE_TAG:-latest}
    container_name: layer1-filter
    environment:
      - LOKI_URL=http://loki:3100
      - LOKI_TENANT=raw
      - LOKI_QUERY=${LAYER1_LOKI_QUERY}
      - POLL_INTERVAL=10
      - DB_HOST=timescaledb
      - DB_PORT=5432
      - DB_NAME=logdb
      - DB_USER=logdb
      - DB_PASSWORD=${TIMESCALEDB_PASSWORD:-logdb_password}
      - ANOMALY_THRESHOLD=${ANOMALY_THRESHOLD:-0.5}
      - BATCH_SIZE=${BATCH_SIZE:-50}
      - AADS_NODE_ID=${AADS_NODE_ID:-controller}
      - ENABLE_PATTERN_FILTER=${ENABLE_PATTERN_FILTER:-true}
      - ENABLE_LOGBERT_FILTER=${ENABLE_LOGBERT_FILTER:-true}
      - INITIAL_LOOKBACK_SECONDS=${INITIAL_LOOKBACK_SECONDS:-300}
    volumes:
      - ./logbert/models:/app/models
    depends_on:
      loki:
        condition: service_started
      timescaledb:
        condition: service_healthy
    networks:
      - observability
    restart: unless-stopped

  ingester:
    image: ${AADS_IMAGE_REGISTRY:-ghcr.io/bs10081}/aads-ingester:${AADS_IMAGE_TAG:-latest}
    container_name: ingester
    ports:
      - "8000:8000"
    environment:
      - DB_HOST=timescaledb
      - DB_PORT=5432
      - DB_NAME=logdb
      - DB_USER=logdb
      - DB_PASSWORD=${TIMESCALEDB_PASSWORD:-logdb_password}
    depends_on:
      timescaledb:
        condition: service_healthy
    networks:
      - observability
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).read()"]
      interval: 30s
      timeout: 10s
      retries: 3

  log-archiver:
    image: ${AADS_IMAGE_REGISTRY:-ghcr.io/bs10081}/aads-log-archiver:${AADS_IMAGE_TAG:-latest}
    container_name: log-archiver
    environment:
      - LOKI_URL=http://loki:3100
      - DB_HOST=timescaledb
      - DB_PORT=5432
      - DB_NAME=logdb
      - DB_USER=logdb
      - DB_PASSWORD=${TIMESCALEDB_PASSWORD:-logdb_password}
      - AADS_NODE_ID=${AADS_NODE_ID:-controller}
      - POLL_INTERVAL=60
      - BATCH_SIZE=1000
    depends_on:
      loki:
        condition: service_started
      timescaledb:
        condition: service_healthy
    networks:
      - observability
    restart: unless-stopped

  layer2-analyzer:
    image: ${AADS_IMAGE_REGISTRY:-ghcr.io/bs10081}/aads-layer2-analyzer:${AADS_IMAGE_TAG:-latest}
    container_name: layer2-analyzer
    ports:
      - "8080:8080"
    environment:
      - DB_HOST=timescaledb
      - DB_PORT=5432
      - DB_NAME=logdb
      - DB_USER=logdb
      - DB_PASSWORD=${TIMESCALEDB_PASSWORD:-logdb_password}
      - POLL_INTERVAL=30
      - BATCH_SIZE=50
      - TIME_WINDOW_MINUTES=5
      - MIN_CLUSTER_SIZE=${MIN_CLUSTER_SIZE:-1}
      - PROMETHEUS_URL=http://prometheus:9090
      - LLM_PROVIDER=${LLM_PROVIDER:-openai_compatible}
      - LLM_BASE_URL=http://litellm:4000/v1
      - LLM_API_KEY=${LITELLM_MASTER_KEY:-sk-aads-dev}
      - LLM_MODEL=${LITELLM_MODEL:-gpt-5.5}
      - LLM_STRATEGY=${LLM_STRATEGY:-cascade}
      - AADS_DEFAULT_NODE_ID=${AADS_DEFAULT_NODE_ID:-target-ubuntu}
      - AADS_NODE_ENVIRONMENT=${AADS_NODE_ENVIRONMENT:-test}
      - AADS_FORCE_GATE_APPROVAL=${AADS_FORCE_GATE_APPROVAL:-false}
      - ENABLE_DIAGNOSIS_REUSE=${ENABLE_DIAGNOSIS_REUSE:-false}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://ollama:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3.2:3b}
      - OLLAMA_ENABLED=${OLLAMA_ENABLED:-false}
      - ENABLE_KNOWLEDGE_BASE=${ENABLE_KNOWLEDGE_BASE:-false}
      - VECTOR_DB_PATH=/app/data/chromadb
      - AUTO_REMEDIATION_ENABLED=${AUTO_REMEDIATION_ENABLED:-false}
      - SEVERITY_FILTER=${SEVERITY_FILTER:-medium}
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL}
      - WEBHOOK_URL=${WEBHOOK_URL}
    volumes:
      - layer2-data:/app/data
    depends_on:
      timescaledb:
        condition: service_healthy
      prometheus:
        condition: service_started
      litellm:
        condition: service_started
    networks:
      - observability
    restart: unless-stopped

  layer4-executor:
    image: ${AADS_IMAGE_REGISTRY:-ghcr.io/bs10081}/aads-layer4-executor:${AADS_IMAGE_TAG:-latest}
    container_name: layer4-executor
    environment:
      - DB_HOST=timescaledb
      - DB_PORT=5432
      - DB_NAME=logdb
      - DB_USER=logdb
      - DB_PASSWORD=${TIMESCALEDB_PASSWORD:-logdb_password}
      - PI_AGENT_TOKEN=${PI_AGENT_TOKEN}
      - EXECUTOR_POLL_INTERVAL=${EXECUTOR_POLL_INTERVAL:-5}
      - NODE_LOCK_TTL_SECONDS=${NODE_LOCK_TTL_SECONDS:-120}
      - ENABLE_KNOWLEDGE_BASE=${ENABLE_KNOWLEDGE_BASE:-false}
    depends_on:
      timescaledb:
        condition: service_healthy
    networks:
      - observability
    restart: unless-stopped

  dashboard:
    image: ${AADS_IMAGE_REGISTRY:-ghcr.io/bs10081}/aads-dashboard:${AADS_IMAGE_TAG:-latest}
    container_name: dashboard
    ports:
      - "5000:5000"
    environment:
      - DB_HOST=timescaledb
      - DB_PORT=5432
      - DB_NAME=logdb
      - DB_USER=logdb
      - DB_PASSWORD=${TIMESCALEDB_PASSWORD:-logdb_password}
      - AADS_ADMIN_API_KEY=${AADS_ADMIN_API_KEY:-change-me-admin-key}
      - AADS_IDEMPOTENCY_TTL_MINUTES=${AADS_IDEMPOTENCY_TTL_MINUTES:-30}
      - AADS_DIST_DIR=/app/dist
    volumes:
      # Serves install-agent.sh + aads-agent.tgz for one-line target installs.
      - ./dist:/app/dist:ro
    depends_on:
      timescaledb:
        condition: service_healthy
    networks:
      - observability
    restart: unless-stopped

volumes:
  loki-data:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local
  timescaledb-data:
    driver: local
  layer2-data:
    driver: local

networks:
  observability:
    driver: bridge

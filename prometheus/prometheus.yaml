# ============================================
# Prometheus Configuration
# 用途：定義要抓取的 metrics 來源
# ============================================

global:
  scrape_interval: 15s        # 預設抓取間隔
  evaluation_interval: 15s    # 規則評估間隔
  external_labels:
    monitor: 'grafana-stack'  # 標記此 Prometheus 實例

# 抓取設定
scrape_configs:
  # ----------------------------------------
  # Job 1: Prometheus 自身監控
  # ----------------------------------------
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # ----------------------------------------
  # Job 2: cAdvisor - Docker 容器 Metrics
  # 這是收集 Docker CPU/記憶體/網路的關鍵
  # ----------------------------------------
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']    # Docker 內部網路名稱
    # 重新標記：只保留有用的標籤
    metric_relabel_configs:
      # 從 container label 提取容器名稱
      - source_labels: [name]
        target_label: container
      # 移除不需要的 metrics（可選，減少儲存）
      # - source_labels: [__name__]
      #   regex: 'container_tasks_state'
      #   action: drop

  # ----------------------------------------
  # Job 3: Alloy 自身 Metrics（可選）
  # ----------------------------------------
  - job_name: 'alloy'
    static_configs:
      - targets: ['alloy:12345']

  # ----------------------------------------
  # Job 4: DCGM Exporter - GPU Metrics
  # 收集 NVIDIA GPU 使用率、記憶體、溫度等
  # ----------------------------------------
  - job_name: 'dcgm'
    static_configs:
      - targets: ['dcgm-exporter:9400']

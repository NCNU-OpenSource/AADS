<!DOCTYPE html>
<html lang="en" data-theme="dark" data-density="regular">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AADS Gate Console</title>
<link rel="stylesheet" href="/static/app/styles.css">
<style>
  html, body { background: #090b0e; }
  [data-theme="light"] body { background: #e7ebef; }
  .ic { vertical-align: -0.14em; }
  .spin { display: inline-block; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
<script>
  // Apply persisted theme/density/accent before paint to avoid a flash.
  (function () {
    try {
      var s = JSON.parse(localStorage.getItem("aadsTweaks") || "{}");
      var el = document.documentElement;
      if (s.theme) el.setAttribute("data-theme", s.theme);
      if (s.density) el.setAttribute("data-density", s.density);
      if (s.accent) {
        var h = s.accent.replace("#", "");
        var r = parseInt(h.slice(0,2),16), g = parseInt(h.slice(2,4),16), b = parseInt(h.slice(4,6),16);
        el.style.setProperty("--accent", s.accent);
        el.style.setProperty("--accent-soft", "rgba("+r+","+g+","+b+",0.14)");
        el.style.setProperty("--accent-line", "rgba("+r+","+g+","+b+",0.42)");
      }
    } catch (e) {}
  })();
</script>
</head>
<body>
<div id="root"></div>

<!-- React + Babel (pinned, dev standalone — matches the internal-tool deploy model) -->
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<!-- live API adapter (plain JS — runs before the babel app scripts) -->
<script src="/static/app/api.js"></script>

<!-- tweaks shell + app (babel, in dependency order) -->
<script type="text/babel" src="/static/tweaks-panel.jsx"></script>
<script type="text/babel" src="/static/app/atoms.jsx"></script>
<script type="text/babel" src="/static/app/queue.jsx"></script>
<script type="text/babel" src="/static/app/detail.jsx"></script>
<script type="text/babel" src="/static/app/shell.jsx"></script>
<script type="text/babel" src="/static/app/app.jsx"></script>
</body>
</html>

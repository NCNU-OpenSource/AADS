# ============================================
# Grafana 資料源自動配置
# ============================================

apiVersion: 1

datasources:
  # Loki - 原始日誌（tenant: raw）
  - name: Loki - Raw Logs
    type: loki
    access: proxy
    url: http://loki:3100
    isDefault: true
    editable: true
    jsonData:
      maxLines: 1000
      timeout: 60
      httpHeaderName1: "X-Scope-OrgID"
    secureJsonData:
      httpHeaderValue1: "raw"

  # Loki - 異常日誌（tenant: anomalies）
  - name: Loki - Anomalies
    type: loki
    access: proxy
    url: http://loki:3100
    isDefault: false
    editable: true
    jsonData:
      maxLines: 1000
      timeout: 60
      httpHeaderName1: "X-Scope-OrgID"
    secureJsonData:
      httpHeaderValue1: "anomalies"

  # Prometheus - Metrics 查詢
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    editable: true
    jsonData:
      timeInterval: "15s"
      httpMethod: "POST"

  # TimescaleDB - 診斷報告和日誌存儲
  - name: TimescaleDB
    type: postgres
    access: proxy
    url: timescaledb:5432
    database: logdb
    user: logdb
    editable: true
    jsonData:
      sslmode: "disable"
      postgresVersion: 1400
      timescaledb: true
    secureJsonData:
      password: "logdb_password"
